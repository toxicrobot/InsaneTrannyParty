<style>
@page {
    size: A4;
    margin: 0;
}
body {
    width: 100%;
    height: 100%;
    margin: 0; 
}
@media print {
  .noPrint{
    display:none;
  }
}

.circular_image {
    background-color: red;
    clip-path: circle();
}



.button{
    width: 54mm;
    height: 54mm;
    position: absolute;
    clip-path: circle();
}
.sheet {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
    width: 210mm;
    height: 297mm;
}


.template {
    display: none;
    width: 54mm;
    height: 54mm;
    z-index: 5;
}
.pin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

</style>
