<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ButtonTemplate</title>
    <script src="buttonScript.js" defer></script>
</head>

<body>

    
    <div class="noPrint">
        <div id="image-menu"></div>
        <div class="preview-panel">
            <div class="preview-controls">
                <button id="preview-prev" type="button" label="Previous sheet">←</button>
                <span id="preview-index">Sheet 1 / 1</span>
                <button id="preview-next" type="button" label="Next sheet">→</button>
                <button onclick="window.print();">Print</button>
                <input type="checkbox" id="templateToggle" name="templateToggle" value="0">
                <label for="templateToggle"> Show template</label><br>
            </div>
            <div class="preview-sheet" >
                <div class="sheet"></div>
            </div>
        </div>

    </div>
    <div class= "sheets"> 
         <div class="sheet">

        </div>
    </div>
</body>
</html>



<style>
:root {
    --button-preview-size: 40mm;
}
@page {
    size: A4;
    margin: 0;
}
body {
    width: 100%;
    height: 100%;
    margin: 0; 
}
@media print {
  .noPrint{
    display:none;
  }
  .sheet {
    
    width: 210mm;
    height: 297mm;
  }
  .sheets {
        display: block;
    }

    .button {
        width: 54mm;
        height: 54mm;
    }
    .template {
        display: none !important;
        width: 54mm;
        height: 54mm;
    }
}

@media screen {
    .noPrint {
        display: flex;
        align-items: flex-start;
        padding: 1rem;
        gap: 5rem;
    }

    .preview-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
    }

    .preview-sheet {
        width: min(30vw);
        background: white;
        border: 1px solid #ddd;
        box-sizing: border-box;
    }

    .sheet {
        height: auto;
        aspect-ratio: 210 / 297;
    }

    .sheets {
        display: none;
    }
    .button {
        width: var(--button-preview-size);
        height:var(--button-preview-size);
    }
    .template {
        width: var(--button-preview-size);
        height:var(--button-preview-size);
    }
}

.circular_image {
    background-color: red;
    clip-path: circle();
}



.button{
    position: absolute;
    clip-path: circle();
}
.template {
    display: none;
    position: absolute;
    clip-path: circle();
    z-index: 5;
}

.sheet {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
}



.pin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

#image-menu {
    --button-preview-size: 40mm;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--button-preview-size) + 1.8rem )), 1fr));
    align-content: start;
    gap: 0.65rem;
    box-sizing: border-box;
    padding: 0.75rem;
    background-color: #fff3f0;
    border: 1px solid #f0cbc3;
    border-radius: 8px;
    flex: 1 1 120px;
    min-width: 220px;
}


.preview-panel {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 0 0 auto;
    align-items: center;
}

.buttonSelector {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    box-sizing: border-box;
    min-width: 0;
    padding: 0.65rem 0.45rem;
    background: #fff;
    border: 1px solid #f2d9d3;
    border-radius: 6px;
}

.previewImage {
    width: min(var(--button-preview-size), 100%);
    height: auto;
    aspect-ratio: 1;
    clip-path: circle();
    object-fit: contain;
}

.buttonSelector input {
    width: 3.5rem;
    box-sizing: border-box;
    text-align: center;

}




</style>
