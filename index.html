<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ButtonTemplate</title>
    <script src="buttonScript.js" defer></script>
</head>

<body>

    
    <div class="noPrint">
        <div id="image-menu"></div>
        <button onclick="window.print();">Print</button>
    </div>
    <div class= "sheets"> 
         <div class="sheet">

        </div>
    </div>


    <script>
        const sheet = document.querySelector(".sheet");
        for (let i = 0; i < 15; i++) {
            const item = document.createElement("div");
            item.className = "pin";
            item.innerHTML = `
                <img class="template" src="buttons/0_single_template-44mm.svg" alt="">
                <img class="button" src="buttons/0_single_template-44mm.svg" alt="">
            `;
            sheet.appendChild(item);
        }
    </script>
   

</body>
</html>



<style>
@page {
    size: A4;
    margin: 0;
}
body {
    width: 100%;
    height: 100%;
    margin: 0; 
}
@media print {
  .noPrint{
    display:none;
  }
  .sheet {
    
    width: 210mm;
    height: 297mm;
  }
}

@media screen {
    .sheet {
    width: 210mm;
    height: 297mm;
    }
}

.circular_image {
    background-color: red;
    clip-path: circle();
}



.button{
    width: 54mm;
    height: 54mm;
    position: absolute;
    clip-path: circle();
}
.sheet {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(5, 1fr);
}


.template {
    display: none;
    width: 54mm;
    height: 54mm;
    z-index: 5;
}
.pin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

</style>
